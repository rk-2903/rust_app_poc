[package]
authors = ["Dilshod Tadjibaev (@antimora)"]
categories = []
description = "Core types and utilities shared across the Burn ecosystem."
documentation = "https://docs.rs/burn-std"
edition = "2024"
keywords = []
license = "MIT OR Apache-2.0"
name = "burn-std"
readme = "README.md"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/burn-std"
version = "0.22.0-pre.3"

[features]
default = ["std", "cubecl-common/default", "cubecl-environment/default"]
doc = ["default"]
std = [
    "cubecl-common/std",
    "cubecl-environment/std",
    "num-traits/std",
    "rand/std",
]
tracing = ["cubecl-common/tracing", "cubecl-environment/tracing"]

network = ["dep:indicatif", "dep:reqwest", "dep:tokio"]

[dependencies]
ahash = { version = "0.8.12", default-features = false }
hashbrown = "0.16"
bytemuck = { version = "1.25.0", features = ["extern_crate_alloc"] }
derive-new = { version = "0.7.0", default-features = false }
enumset = { version = "1.1.13", default-features = false }
half = { version = "2.7.1", features = ["bytemuck"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
rand_distr = { version = "0.6.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
smallvec = { version = "1", features = ["const_generics", "const_new", "serde"] }
spin = { version = "0.11.0", features = ["mutex", "spin_mutex", "portable-atomic"] }
thiserror = { version = "2", default-features = false }

# ParamId
data-encoding = { version = "2.11.0", default-features = false, features = ["alloc"] }
uuid = { version = "1.23.0", default-features = false }

cubecl-common = { version = "=0.11.0-pre.3", default-features = false, features = [
    "serde",
    "shared-bytes",
    "fp8",
] }
cubecl-environment = { version = "=0.11.0-pre.3", default-features = false, features = [
    "shared-bytes",
] }
cubecl-zspace = { version = "=0.11.0-pre.3", default-features = false }
# Enable extra-platforms for portable-atomic support on targets without native atomics (e.g., thumbv6m)
# This is needed because cubecl-common's shared-bytes feature pulls in bytes
bytes = { version = "1.11.1", default-features = false }

# Network downloader
indicatif = { version = "0.18", optional = true }
reqwest = { version = "0.13", optional = true }
tokio = { version = "1", optional = true }

# Enable extra-platforms for bytes on targets without native atomics (e.g., thumbv6m-none-eabi)
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
bytes = { version = "1.11.1", default-features = false, features = ["extra-platforms"] }
portable-atomic-util = "0.2"

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
